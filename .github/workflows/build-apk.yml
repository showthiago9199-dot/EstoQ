name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar projeto
        run: |
          mkdir -p www
          cp index.html www/index.html
          for f in manifest.json icon-192.png icon-512.png; do [ -f "$f" ] && cp "$f" www/ || true; done
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init EstoQ io.github.showthiago9199dot.estoq --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Aplicar icone
        run: |
          sudo apt-get install -y imagemagick > /dev/null
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            convert icon-512.png -resize ${s}x${s} \( -size ${s}x${s} xc:none -fill white -draw "circle $((s/2)),$((s/2)) $((s/2)),0" \) -compose DstIn -composite $RES/mipmap-$n/ic_launcher_round.png
          done
      - name: Compilar
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Publicar APK na Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EstoQ.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest EstoQ.apk --title "EstoQ" --notes "APK mais recente"
